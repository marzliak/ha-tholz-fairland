<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tholz Fairland for Home Assistant, private release candidate 0.3.0</title>
  <desc id="hero-desc">Contextual pool photograph with a navy panel on the left. The title introduces a pool heat pump integration for Home Assistant. A synthetic control card on the right is labelled Illustrative values and is not a Home Assistant screenshot.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1F33" stop-opacity="0.97"/>
      <stop offset="0.5" stop-color="#0B1F33" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0B1F33" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
    .eyebrow { font-size: 24px; font-weight: 700; letter-spacing: 3px; fill: #FF8A6B; }
    .chip { fill: #123550; stroke: #1FA7A3; stroke-width: 1.5; }
    .chip-text { font-size: 23px; fill: #D5EEF0; }
    .card-label { font-size: 24px; fill: #9FB8C8; }
    .card-value { font-size: 26px; fill: #EAF4F8; text-anchor: end; }
    .rule { stroke: #1D4460; stroke-width: 1; }
  </style>
  <rect width="1600" height="560" fill="#0B1F33"/>
  <image href="pool-context.jpg" x="0" y="-330" width="1600" height="1067" preserveAspectRatio="none"/>
  <rect width="1600" height="560" fill="url(#fade)"/>

  <text x="80" y="150" class="eyebrow">PRIVATE RELEASE CANDIDATE · 0.3.0</text>
  <text x="80" y="256" font-size="92" fill="#EAF4F8">Tholz Fairland</text>
  <text x="80" y="314" font-size="36" fill="#BFE9E6">Pool heat pump control and read-only telemetry</text>
  <text x="80" y="356" font-size="36" fill="#BFE9E6">for Home Assistant</text>

  <rect class="chip" x="80" y="392" width="226" height="46" rx="23"/>
  <text class="chip-text" x="98" y="423">Mode · target · fan</text>
  <rect class="chip" x="326" y="392" width="384" height="46" rx="23"/>
  <text class="chip-text" x="344" y="423">Read-only metrics and schedules</text>
  <rect class="chip" x="730" y="392" width="290" height="46" rx="23"/>
  <text class="chip-text" x="748" y="423">Reauth keeps your entry</text>

  <text x="80" y="500" font-size="20" fill="#C4D8E2" font-weight="400">Photo: Unsplash, contextual only. Not the user's installation or a supported heater.</text>
  <text x="80" y="530" font-size="20" fill="#C4D8E2" font-weight="400">Control card: original illustration with example values.</text>

  <rect x="1040" y="70" width="480" height="460" rx="20" fill="#10304A" stroke="#1FA7A3" stroke-width="2"/>
  <rect x="1064" y="90" width="352" height="46" rx="23" fill="#FF7A59"/>
  <text x="1084" y="121" font-size="24" font-weight="700" letter-spacing="1px" fill="#0B1F33">ILLUSTRATIVE VALUES</text>
  <text x="1068" y="180" font-size="30" fill="#EAF4F8">Pool heater (example)</text>
  <text x="1068" y="210" font-size="20" font-weight="400" fill="#9FB8C8">Not a Home Assistant screenshot</text>

  <text class="card-label" x="1068" y="246">Mode</text><text class="card-value" x="1500" y="246">Automatic</text>
  <line class="rule" x1="1068" y1="260" x2="1500" y2="260"/>
  <text class="card-label" x="1068" y="284">Target</text><text class="card-value" x="1500" y="284">28.0 °C</text>
  <line class="rule" x1="1068" y1="298" x2="1500" y2="298"/>
  <text class="card-label" x="1068" y="322">Fan mode</text><text class="card-value" x="1500" y="322">Intelligent</text>
  <line class="rule" x1="1068" y1="336" x2="1500" y2="336"/>
  <text class="card-label" x="1068" y="360">Inlet</text><text class="card-value" x="1500" y="360">24.5 °C</text>
  <line class="rule" x1="1068" y1="374" x2="1500" y2="374"/>
  <text class="card-label" x="1068" y="398">Ambient</text><text class="card-value" x="1500" y="398">19.0 °C</text>
  <line class="rule" x1="1068" y1="412" x2="1500" y2="412"/>
  <text class="card-label" x="1068" y="436">Heating, 24 h</text><text class="card-value" x="1500" y="436">2 h 10 min</text>
  <line class="rule" x1="1068" y1="450" x2="1500" y2="450"/>
  <text class="card-label" x="1068" y="474">Duty cycle, 24 h</text><text class="card-value" x="1500" y="474">9 %</text>

  <text x="1068" y="508" font-size="20" fill="#9FB8C8">Target range 12–40 °C</text>
  <line x1="1068" y1="524" x2="1500" y2="524" stroke="#2A5573" stroke-width="6" stroke-linecap="round"/>
  <line x1="1068" y1="524" x2="1315" y2="524" stroke="#1FA7A3" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1315" cy="524" r="9" fill="#5EE6E0"/>
</svg>
